name: 生成主页动图

on:
  # 每天北京时间 00:00（UTC 16:00）重新生成，贡献变了图也跟着变
  schedule:
    - cron: "0 16 * * *"
  # 允许在 Actions 页面手动点击运行
  workflow_dispatch:
  # 推送到 main 时也跑一次，改完 README 立刻能看到效果
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: 生成 3D 贡献图
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: 生成贪吃蛇动画
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23b8bb26

      - name: 汇总产物
        run: cp profile-3d-contrib/*.svg dist/

      - name: 推送到 output 分支
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
