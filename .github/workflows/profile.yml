name: 渲染主页

on:
  # 每天北京时间 00:00（UTC 16:00）重新渲染
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # 配色无所谓，generate.py 会把它换成 Catppuccin 并套上窗口外壳
      - name: 生成贪吃蛇
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: snake/snake.svg

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 渲染面板
        run: |
          pip install --quiet fonttools brotli
          python scripts/generate.py --out dist --snake snake/snake.svg
        env:
          # 配了 PROFILE_TOKEN（只读 PAT）时语言统计会包含私有仓库，否则只统计公开仓库
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      # main 推到 output（README 引用的分支）；其他分支推到 output-preview，试跑不影响线上
      - name: 推送产物
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: ${{ github.ref == 'refs/heads/main' && 'output' || 'output-preview' }}
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
